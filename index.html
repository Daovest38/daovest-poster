<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DaoVest 海报 & 文案生成器</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4f1;--card:#fff;--tx:#222;--mut:#777;--ac:#b30000;--bd:#ddd}
@media (prefers-color-scheme:dark){:root{--bg:#1a1a1a;--card:#262626;--tx:#eee;--mut:#aaa;--bd:#444}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans SC",system-ui,sans-serif}
header{padding:14px 20px;background:var(--ac);color:#fff;font-size:18px;font-weight:700}
main{display:grid;grid-template-columns:340px 1fr;gap:16px;padding:16px;max-width:1200px;margin:auto}
@media(max-width:800px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;font:inherit;background:var(--bg);color:var(--tx)}
textarea{height:210px;resize:vertical;font-size:14px}
button{padding:9px 14px;border:0;border-radius:6px;background:var(--ac);color:#fff;font:inherit;cursor:pointer;margin:8px 8px 0 0}
button.alt{background:#555}
.chk{display:flex;gap:6px;align-items:center;font-size:13px;margin-top:12px;color:var(--mut)}
.chk input{width:auto}
canvas{width:100%;height:auto;border-radius:8px;border:1px solid var(--bd)}
.right{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:1000px){.right{grid-template-columns:1fr}}
.tabs button{background:var(--bd);color:var(--tx);margin:0 6px 8px 0}.tabs button.on{background:var(--ac);color:#fff}
</style>
</head>
<body>
<header>DaoVest 海报 & 文案一键生成</header>
<main>
  <div class="card">
    <label>海报类型</label>
    <select id="type"></select>
    <div id="fields"></div>
    <div class="chk"><input type="checkbox" id="clean"><span>底图已无文字（不覆盖原有文字）</span></div>
    <button id="dl">⬇ 下载海报</button>
  </div>
  <div class="right">
    <div class="card"><canvas id="cv"></canvas></div>
    <div class="card" id="copyCard">
      <div class="tabs" id="tabs"></div>
      <textarea id="copy" readonly></textarea>
      <button id="cp">📋 复制文案</button><span id="ok" style="font-size:13px"></span>
    </div>
  </div>
</main>
<script>
const WD=['日','一','二','三','四','五','六'];
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return {y,m,d,w:WD[new Date(y,m-1,d).getDay()]}};
const p2=n=>String(n).padStart(2,'0');
const D=(v)=>v?pd(v):{y:'',m:'',d:'',w:''};
const dark='#1a1a1a';
// boxes: x,y,w,h = 覆盖区域（图片像素坐标）；align；size；text(values)
const P={
 qfw:{name:'全方位课程',img:'assets/quanfangwei.png',
  fields:[{id:'day',label:'Day',type:'select',opts:['1','2','3','4'],def:'2'},
          {id:'date',label:'上课日期',type:'date',def:'2026-11-28'},
          {id:'topic',label:'主题',type:'text',def:'崩盘交易'}],
  boxes:[{x:485,y:803,w:490,h:78,ax:488,size:52,t:v=>{const o=D(v.date);return `${o.m}月${o.d}号（星期${o.w}）`}},
         {x:485,y:1183,w:490,h:78,ax:488,size:52,t:v=>v.topic}],
  copy:v=>{const fb=`@everyone 大家好，\n同学好，\n敬请留意，如果您还没有完成全方位课程的 DAY ${v.day} 课程，请检查一下您的电邮，行政已经发出注册上课的电邮。\n如果您想温故知新，欢迎报名重复上课。\n重复上课报名链接：https://forms.gle/bCEDVWDuVCa3Xp6B6\n\n请学员们在星期四之前安排时间，并完成上课注册，感谢您的配合。\n如需协助，请联系行政：019-501 6836\n祝您生活顺心，投资顺利。\n朝阳`;
    return {'Facebook 版':fb,'Telegram 版':fb.replace('@everyone 大家好，','大家好，')}}},
 yz:{name:'赢在起跑线',img:'assets/yingzai.png',
  fields:[{id:'date',label:'日期',type:'date',def:'2026-09-13'},
          {id:'place',label:'地点',type:'text',def:'Taetea 大益茶馆'}],
  boxes:[{x:745,y:752,w:405,h:68,ax:750,size:46,t:v=>{const o=D(v.date);return `${o.m}月${o.d}日`}},
         {x:745,y:955,w:405,h:70,ax:748,size:46,t:v=>v.place}]},
 hg:{name:'宏观行业 Live 分析',img:'assets/hongguan.png',
  fields:[{id:'date',label:'日期',type:'date',def:'2026-11-20'},
          {id:'time',label:'时间',type:'text',def:'8pm'}],
  boxes:[{x:445,y:818,w:385,h:76,cx:608,size:62,t:v=>{const o=D(v.date);return `${o.m}月${o.d}日`}},
         {x:445,y:948,w:385,h:76,cx:608,size:62,t:v=>v.time}]},
 tu:{name:'Tutorial 通知',img:'assets/tutorial.png',
  fields:[{id:'date',label:'日期',type:'date',def:'2026-12-01'},
          {id:'time',label:'海报时间',type:'text',def:'8pm'},
          {id:'ctime',label:'文案时间',type:'text',def:'08:00 PM - 9:00 PM'},
          {id:'zoom',label:'Zoom 注册链接',type:'text',def:'https://us06web.zoom.us/meeting/register/49kVEPoRSheJAZqqvmHwjw'}],
  boxes:[{x:455,y:693,w:340,h:72,cx:612,size:60,t:v=>{const o=D(v.date);return `${o.m}月${o.d}日`}},
         {x:455,y:813,w:340,h:72,cx:612,size:60,t:v=>v.time}],
  copy:v=>{const o=D(v.date);return {'文案':`诚邀出席生财有道~道资 Tutorial\n日期：${p2(o.d)}-${p2(o.m)}-${o.y}（周${o.w}）\n时间：${v.ctime}\n\n重要提醒\n‼️ 请点击以下链接完成 Zoom 注册，获取课程专属会议链接 ：\n👉 Zoom 注册链接：\n${v.zoom}\n\n⚠️ 注意：\n以上链接为 注册页面，非会议链接。\n注册完成后，Zoom 将通过邮箱发送会议链接，请注意查收 📧。\n\n祝您学习愉快，早日实现投资目标！🌟\n\n道资行政部`}}},
 kl:{name:'康乐活动',img:'assets/kangle.png',
  fields:[{id:'date',label:'日期',type:'date',def:'2026-12-06'},
          {id:'time',label:'时间',type:'text',def:'8.30am'},
          {id:'place',label:'地点',type:'text',def:'Bukit Kiara'},
          {id:'act',label:'活动',type:'text',def:'走山，早餐'},
          {id:'fb',label:'FB event 链接',type:'text',def:'https://fb.me/e/6AoJIuPuF'}],
  boxes:[{x:738,y:585,w:430,h:70,ax:745,size:48,t:v=>{const o=D(v.date);return `${o.m}月${o.d}日`}},
         {x:738,y:688,w:430,h:70,ax:757,size:48,t:v=>v.time},
         {x:738,y:792,w:430,h:70,ax:745,size:48,t:v=>v.place},
         {x:733,y:905,w:285,h:80,ax:740,size:48,t:v=>v.act}],
  copy:v=>{const o=D(v.date);return {'文案':`诚邀大家${o.m}月${o.d}日周${o.w}早上${v.time.replace('.',':')}, 和邱天雄老师一起运动走山 \n${v.fb}\n大家也可以带朋友家人过来。`}}}
};
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const imgs={};
let cur='qfw',vals={};

$('type').innerHTML=Object.entries(P).map(([k,p])=>`<option value="${k}">${p.name}</option>`).join('');
$('type').onchange=e=>{cur=e.target.value;buildFields()};
$('clean').onchange=render;

function buildFields(){
  const p=P[cur];vals={};
  $('fields').innerHTML=p.fields.map(f=>{
    vals[f.id]=f.def;
    const inp=f.type==='select'
      ?`<select id="f_${f.id}">${f.opts.map(o=>`<option ${o===f.def?'selected':''}>${o}</option>`).join('')}</select>`
      :`<input id="f_${f.id}" type="${f.type}" value="${f.def}">`;
    return `<label>${f.label}</label>${inp}`}).join('');
  p.fields.forEach(f=>$('f_'+f.id).oninput=e=>{vals[f.id]=e.target.value;render()});
  render();
}
function loadImg(src){return new Promise(r=>{if(imgs[src])return r(imgs[src]);const i=new Image();i.onload=()=>{imgs[src]=i;r(i)};i.src=src})}

async function render(){
  const p=P[cur],img=await loadImg(p.img);
  await document.fonts.load('700 40px "Noto Sans SC"','生财有道0123');
  cv.width=img.width;cv.height=img.height;
  ctx.drawImage(img,0,0);
  const clean=$('clean').checked;
  p.boxes.forEach(b=>{
    if(!clean){
      let col='#fdf8f3';
      try{const d=ctx.getImageData(b.x+b.w-8,b.y+b.h/2,1,1).data;col=`rgb(${d[0]},${d[1]},${d[2]})`}catch(e){}
      ctx.fillStyle=col;ctx.fillRect(b.x,b.y,b.w,b.h);
    }
    ctx.fillStyle=dark;ctx.textBaseline='middle';
    ctx.font=`700 ${b.size}px "Noto Sans SC",sans-serif`;
    let s=b.size,txt=b.t(vals);
    while(ctx.measureText(txt).width>b.w-20&&s>20){s-=2;ctx.font=`700 ${s}px "Noto Sans SC",sans-serif`}
    ctx.textAlign=b.cx?'center':'left';
    ctx.fillText(txt,b.cx||b.ax,b.y+b.h/2+2);
  });
  renderCopy();
}
let copies={},tab='';
function renderCopy(){
  const p=P[cur];$('copyCard').style.display=p.copy?'':'none';
  if(!p.copy)return;
  copies=p.copy(vals);
  if(!copies[tab])tab=Object.keys(copies)[0];
  $('tabs').innerHTML=Object.keys(copies).map(k=>`<button class="${k===tab?'on':''}" data-k="${k}">${k}</button>`).join('');
  $('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.k;renderCopy()});
  $('copy').value=copies[tab];
}
$('cp').onclick=async()=>{
  try{await navigator.clipboard.writeText($('copy').value)}catch(e){$('copy').select();document.execCommand('copy')}
  $('ok').textContent='已复制 ✓';setTimeout(()=>$('ok').textContent='',1500)};
$('dl').onclick=()=>{
  cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);
    a.download=`${P[cur].name}_${vals.date||'poster'}.png`;a.click()},'image/png')};
buildFields();
</script>
</body>
</html>
